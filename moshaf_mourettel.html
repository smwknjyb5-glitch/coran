 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المصحف المرتّل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f4ecd8;
    --paper-dark:#e9dfc3;
    --ink:#1c2440;
    --ink-soft:#3a4266;
    --gold:#b8862e;
    --gold-light:#d9b45a;
    --emerald:#1f5c4a;
    --emerald-dark:#123d31;
    --maroon:#7a2e2e;
    --shadow: 0 10px 30px rgba(18,61,49,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(circle at 50% 0%, #1e4438 0%, var(--emerald-dark) 55%, #0c2019 100%);
    min-height:100vh;
    font-family:'Tajawal', sans-serif;
    color:var(--ink);
    padding: 28px 16px 60px;
  }

  .top{
    max-width: 880px;
    margin: 0 auto 22px;
    text-align:center;
  }
  .top h1{
    font-family:'Amiri', serif;
    color:#f3e6c4;
    font-size: clamp(28px, 5vw, 40px);
    margin: 0 0 4px;
    letter-spacing: 1px;
  }
  .top p{
    color:#bcd8cc;
    font-size:14px;
    margin:0;
  }

  .controls{
    max-width: 880px;
    margin: 22px auto;
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    justify-content:center;
    align-items:center;
  }
  .controls select, .controls button{
    font-family:'Tajawal', sans-serif;
    font-size:15px;
    padding:10px 16px;
    border-radius:10px;
    border:1px solid var(--gold-light);
    background:#f8f2e2;
    color:var(--ink);
    cursor:pointer;
  }
  .controls button{
    background: linear-gradient(180deg, var(--gold-light), var(--gold));
    color:#2a1c04;
    font-weight:700;
    border:none;
    box-shadow:0 3px 0 #8a641c;
  }
  .controls button:active{ transform: translateY(2px); box-shadow:0 1px 0 #8a641c;}
  .controls button:disabled{ opacity:.5; cursor:not-allowed; box-shadow:none; }
  .controls select:focus, .controls button:focus-visible{
    outline: 3px solid #fff2c9;
    outline-offset: 2px;
  }

  .status{
    max-width:880px;
    margin: 0 auto 10px;
    text-align:center;
    color:#e9dfc3;
    font-size:13px;
    min-height:18px;
  }

  /* Mushaf page */
  .page-wrap{
    max-width: 820px;
    margin: 0 auto;
    position:relative;
    padding: 10px;
  }
  .page{
    background: var(--paper);
    background-image:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.015) 0px, rgba(0,0,0,0.015) 1px, transparent 1px, transparent 38px);
    border-radius: 6px;
    box-shadow: var(--shadow);
    padding: 46px 34px;
    position:relative;
    border: 1px solid #cbb989;
  }
  .corner{
    position:absolute;
    width:54px; height:54px;
    pointer-events:none;
  }
  .corner svg{ width:100%; height:100%; }
  .corner.tl{ top:10px; right:10px; transform: scaleX(-1); }
  .corner.tr{ top:10px; left:10px; }
  .corner.bl{ bottom:10px; right:10px; transform: scale(-1,-1); }
  .corner.br{ bottom:10px; left:10px; transform: scaleY(-1); }

  .surah-title{
    text-align:center;
    font-family:'Amiri', serif;
    color:var(--emerald-dark);
    font-size:22px;
    margin: 4px 0 6px;
  }
  .surah-meta{
    text-align:center;
    color:var(--gold);
    font-size:13px;
    margin-bottom:18px;
    letter-spacing:1px;
  }
  .bismillah{
    text-align:center;
    font-family:'Amiri Quran', serif;
    font-size:26px;
    color:var(--maroon);
    margin: 6px 0 22px;
  }

  .mushaf-text{
    font-family:'Amiri Quran', serif;
    font-size: clamp(22px, 3.2vw, 28px);
    line-height: 2.6;
    text-align: justify;
    text-align-last: center;
    color: var(--ink);
  }
  .ayah{
    cursor:pointer;
    padding: 3px 2px;
    border-radius: 6px;
    transition: background .25s, color .25s;
  }
  .ayah:hover{
    background: rgba(184,134,46,0.15);
  }
  .ayah.playing{
    background: var(--emerald);
    color: #fdf6e3;
    box-shadow: 0 0 0 3px rgba(31,92,74,0.25);
  }
  .ayah-num{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width: 30px; height:30px;
    border-radius:50%;
    border: 1.5px solid var(--gold);
    color: var(--gold);
    font-family:'Tajawal', sans-serif;
    font-size: 13px;
    font-weight:700;
    margin: 0 6px;
    vertical-align: middle;
    background: #fdf6e3;
  }
  .ayah.playing .ayah-num{
    background:#fdf6e3;
    color:var(--emerald-dark);
    border-color:#fdf6e3;
  }

  .loading, .empty{
    text-align:center;
    color: var(--ink-soft);
    font-size:15px;
    padding: 40px 10px;
  }

  .foot-note{
    max-width:820px;
    margin: 18px auto 0;
    text-align:center;
    color:#a9c7ba;
    font-size:12px;
    line-height:1.8;
  }

  @media (max-width:600px){
    .page{ padding: 34px 16px; }
    .mushaf-text{ line-height:2.4; }
  }

  @media (prefers-reduced-motion: reduce){
    .ayah{ transition:none; }
  }
</style>
</head>
<body>

<div class="top">
  <h1>المصحف المرتّل</h1>
  <p>استمع إلى تلاوة القرآن الكريم آيةً آية، مع عرض النص بخط عثماني</p>
</div>

<div class="controls">
  <select id="surahSelect" aria-label="اختر السورة"></select>
  <select id="reciterSelect" aria-label="اختر القارئ">
    <option value="ar.alafasy">مشاري العفاسي</option>
    <option value="ar.husary">محمود خليل الحصري</option>
    <option value="ar.abdulbasitmurattal">عبد الباسط عبد الصمد (مرتل)</option>
    <option value="ar.minshawi">محمد صديق المنشاوي</option>
  </select>
  <button id="playAllBtn">▶ تشغيل السورة كاملة</button>
  <button id="stopBtn" disabled>■ إيقاف</button>
</div>

<div class="status" id="status"></div>

<div class="page-wrap">
  <div class="page">
    <div class="corner tl"><svg viewBox="0 0 60 60"><path d="M2 2 Q2 30 30 30 Q2 30 2 58" fill="none" stroke="#b8862e" stroke-width="1.5"/><circle cx="2" cy="2" r="4" fill="#b8862e"/></svg></div>
    <div class="corner tr"><svg viewBox="0 0 60 60"><path d="M2 2 Q2 30 30 30 Q2 30 2 58" fill="none" stroke="#b8862e" stroke-width="1.5"/><circle cx="2" cy="2" r="4" fill="#b8862e"/></svg></div>
    <div class="corner bl"><svg viewBox="0 0 60 60"><path d="M2 2 Q2 30 30 30 Q2 30 2 58" fill="none" stroke="#b8862e" stroke-width="1.5"/><circle cx="2" cy="2" r="4" fill="#b8862e"/></svg></div>
    <div class="corner br"><svg viewBox="0 0 60 60"><path d="M2 2 Q2 30 30 30 Q2 30 2 58" fill="none" stroke="#b8862e" stroke-width="1.5"/><circle cx="2" cy="2" r="4" fill="#b8862e"/></svg></div>

    <div id="surahHeader"></div>
    <div id="content" class="loading">جاري تحميل قائمة السور…</div>
  </div>
</div>

<div class="foot-note">
  النصوص والتلاوات الصوتية مصدرها واجهة alquran.cloud العامة. يتطلب الاستماع اتصالاً بالإنترنت.
</div>

<audio id="player" preload="none"></audio>

<script>
const surahSelect = document.getElementById('surahSelect');
const reciterSelect = document.getElementById('reciterSelect');
const playAllBtn = document.getElementById('playAllBtn');
const stopBtn = document.getElementById('stopBtn');
const statusEl = document.getElementById('status');
const contentEl = document.getElementById('content');
const surahHeaderEl = document.getElementById('surahHeader');
const player = document.getElementById('player');

let currentAyahs = []; // {numberInSurah, text, audio}
let currentIndex = -1;
let isPlayingAll = false;
let surahsList = [];

function setStatus(msg){ statusEl.textContent = msg; }

async function loadSurahList(){
  try{
    const res = await fetch('https://api.alquran.cloud/v1/surah');
    const data = await res.json();
    surahsList = data.data;
    surahSelect.innerHTML = surahsList.map(s =>
      `<option value="${s.number}">${s.number}. ${s.name} — ${s.englishName}</option>`
    ).join('');
    contentEl.className = 'empty';
    contentEl.textContent = 'اختر سورة من القائمة أعلاه لعرضها والاستماع إليها';
  }catch(err){
    contentEl.className = 'empty';
    contentEl.textContent = 'تعذّر تحميل قائمة السور. تحقق من اتصال الإنترنت وحاول مجددًا.';
  }
}

async function loadSurah(){
  stopAll();
  const num = surahSelect.value;
  const reciter = reciterSelect.value;
  contentEl.className = 'loading';
  contentEl.textContent = 'جاري تحميل السورة والتلاوة…';
  surahHeaderEl.innerHTML = '';
  try{
    const res = await fetch(`https://api.alquran.cloud/v1/surah/${num}/editions/quran-uthmani,${reciter}`);
    const data = await res.json();
    const textEd = data.data[0];
    const audioEd = data.data[1];

    currentAyahs = textEd.ayahs.map((a, i) => ({
      numberInSurah: a.numberInSurah,
      text: a.text,
      audio: audioEd.ayahs[i].audio
    }));

    surahHeaderEl.innerHTML = `
      <div class="surah-title">سورة ${textEd.name}</div>
      <div class="surah-meta">${textEd.revelationType === 'Meccan' ? 'مكية' : 'مدنية'} · عدد الآيات ${textEd.numberOfAyahs}</div>
      ${num != 1 && num != 9 ? '<div class="bismillah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>' : ''}
    `;

    renderAyahs();
    setStatus('جاهز للاستماع — اضغط على أي آية لتشغيلها، أو "تشغيل السورة كاملة"');
  }catch(err){
    contentEl.className = 'empty';
    contentEl.textContent = 'تعذّر تحميل السورة. تحقق من اتصال الإنترنت وحاول مجددًا.';
  }
}

function renderAyahs(){
  contentEl.className = 'mushaf-text';
  contentEl.innerHTML = currentAyahs.map((a, i) =>
    `<span class="ayah" data-i="${i}" tabindex="0" role="button" aria-label="تشغيل الآية ${a.numberInSurah}">${a.text}<span class="ayah-num">${toArabicDigits(a.numberInSurah)}</span></span> `
  ).join('');

  contentEl.querySelectorAll('.ayah').forEach(el => {
    el.addEventListener('click', () => playSingle(parseInt(el.dataset.i)));
    el.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); playSingle(parseInt(el.dataset.i)); }
    });
  });
}

function toArabicDigits(n){
  const map = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
  return String(n).split('').map(d => map[+d] ?? d).join('');
}

function highlightCurrent(){
  contentEl.querySelectorAll('.ayah').forEach(el => el.classList.remove('playing'));
  if(currentIndex >= 0){
    const el = contentEl.querySelector(`.ayah[data-i="${currentIndex}"]`);
    if(el){
      el.classList.add('playing');
      el.scrollIntoView({behavior:'smooth', block:'center'});
    }
  }
}

function playSingle(i){
  isPlayingAll = false;
  stopBtn.disabled = true;
  currentIndex = i;
  const ayah = currentAyahs[i];
  player.src = ayah.audio;
  player.play().catch(()=> setStatus('تعذّر تشغيل الصوت. حاول مرة أخرى.'));
  highlightCurrent();
  setStatus(`تشغيل الآية ${toArabicDigits(ayah.numberInSurah)}`);
}

function playAll(){
  if(currentAyahs.length === 0) return;
  isPlayingAll = true;
  stopBtn.disabled = false;
  currentIndex = 0;
  playCurrentInSequence();
}

function playCurrentInSequence(){
  const ayah = currentAyahs[currentIndex];
  player.src = ayah.audio;
  player.play().catch(()=> setStatus('تعذّر تشغيل الصوت. حاول مرة أخرى.'));
  highlightCurrent();
  setStatus(`تشغيل الآية ${toArabicDigits(ayah.numberInSurah)} من ${toArabicDigits(currentAyahs.length)}`);
}

player.addEventListener('ended', () => {
  if(isPlayingAll){
    currentIndex++;
    if(currentIndex < currentAyahs.length){
      playCurrentInSequence();
    }else{
      stopAll();
      setStatus('انتهت تلاوة السورة');
    }
  }
});

function stopAll(){
  isPlayingAll = false;
  player.pause();
  player.removeAttribute('src');
  currentIndex = -1;
  stopBtn.disabled = true;
  highlightCurrent();
}

surahSelect.addEventListener('change', loadSurah);
reciterSelect.addEventListener('change', loadSurah);
playAllBtn.addEventListener('click', playAll);
stopBtn.addEventListener('click', () => { stopAll(); setStatus('تم الإيقاف'); });

loadSurahList();
</script>

</body>
</html>
